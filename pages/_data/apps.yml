- packageName: org.torproject.vpn
  webSite: https://www.torproject.org/
  description: |-
    <b>Beta release: The VPN that fights back</b>
    <p>Tor VPN Beta puts control back in your hands when others try to cut you off from the world. This early-access release is for users who want to help shape the future of mobile privacy and can do safely.</p>
    <b>What can Tor VPN Beta do?</b>
    <ul>
      <li>Network-level privacy: Tor VPN hides your real IP address and location from the apps and services you use–and from anyone watching your connection.</li>
      <li>Per-app routing: You choose which apps are routed through Tor. Each app gets its own Tor circuit and exit IP, preventing network observers from connecting all of your online activity.</li>
      <li>App-level censorship resistance: When access is blocked, Tor VPN may help reconnect your essential apps to the internet. (Beta limitation: This early access version has limited anti-censorship capabilities and users may face connection issues)</li>
      <li>Built on Arti: Tor VPN uses Tor's next-generation Rust implementation. That means safer memory handling, modern code architecture, and a stronger security foundation than legacy C-Tor tools.</li>
    <b>Who is Tor VPN Beta for?</b>
    <p>Tor VPN Beta is an early-access release and not suitable for high-risk users or sensitive use-cases during the beta period.</p>
    <p>Tor VPN Beta is for early adopters who want to help shape mobile privacy and can do so safely. Users should expect bugs and report issues. If you're ready to test, bring the app to its limits, and share feedback, we'd love your help tipping the scales toward a freer internet.</p>
    <b>Important limitations (PLEASE READ)</b>
    <p>Tor VPN is not a silver bullet either: Some Android platform data can still identify your device; no VPN can fully prevent this. If you face extreme surveillance risks, we recommend against using Tor VPN Beta.</p>
    <p>Not all of Tor's anti-censorship features are implemented yet. Users in heavily censored regions might not be able to use Tor VPN Beta to connect to Tor or the internet.</p>
